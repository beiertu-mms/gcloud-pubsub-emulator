name: Lint Code Base
"on":
  pull_request:
    types:
      - "opened"
      - "reopened"
      - "synchronize"

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Lint
        uses: oxsecurity/megalinter/flavors/ci_light@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
        # see https://megalinter.io/flavors/ci_light/
        # See https://megalinter.io/configuration/ for all available configurations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          APPLY_FIXES: none
          LOG_LEVEL: INFO
          PRINT_ALPACA: false
          ENABLE_LINTERS: BASH_SHELLCHECK,YAML_YAMLLINT,DOCKERFILE_HADOLINT,REPOSITORY_GIT_DIFF,REPOSITORY_GRYPE,REPOSITORY_TRUFFLEHOG

      - name: Upload reports
        if: ${{ success() }} || ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MegaLinter reports
          path: |
            megalinter-reports
            mega-linter.log
